name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please remove names, URLs, tokens and transcript text you do not want to make public.
        Security problems: please report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. web.bat\n2. New transcript, engine parakeet, language cs\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`uv run mgtranscriber --version`, or the release / Docker tag"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [install.bat / setup .exe, uv sync (from source), Docker (GPU), Docker (CPU), other]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: "`nvidia-smi --query-gpu=name,driver_version --format=csv,noheader`, or 'none'"
  - type: input
    id: engine
    attributes:
      label: Engine, model and language
      placeholder: "whisperx, large-v3, cs"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The job log from the web UI, or the console output (the relevant part)
      render: text
