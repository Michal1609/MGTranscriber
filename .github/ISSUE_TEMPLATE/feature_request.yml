name: Feature request
description: An idea or a missing feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
